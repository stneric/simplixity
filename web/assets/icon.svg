<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Master art for the generated PNGs, see tools/icons.sh. Square and
       full-bleed: every platform that shows this one applies its own mask, so
       drawing rounded corners here would only stack two radii.

       Monochrome. The stylesheet's rule is "colour is reserved for
       state, never decoration", and an app icon is decoration, so it takes the
       same near-black the UI carries in its fg and accent tokens.

       The points reach r=168 from centre, inside the maskable safe zone (the
       middle 80%, r=205), which is why one file covers every purpose. -->
  <rect width="512" height="512" fill="#1a1a1a" />
  <path
    d="M256 88 Q308 204 424 256 Q308 308 256 424 Q204 308 88 256 Q204 204 256 88 Z"
    fill="#ffffff"
  />
</svg>
