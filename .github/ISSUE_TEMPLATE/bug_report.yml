name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The question you asked, depth and sources, the model. Screenshots of the transcript and run footer help.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. v0.1.0 or a1b2c3d
  - type: dropdown
    id: setup
    attributes:
      label: How do you run it?
      options:
        - Docker Compose
        - Docker Compose behind a reverse proxy
        - Without Docker
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `docker compose logs simplixity`. Remove API keys first.
      render: text
